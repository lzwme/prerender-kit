name: 'Tests'

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.vscode/**'
      - '.editorconfig'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.vscode/**'
      - '.editorconfig'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # 仅 windows / macos 允许失败（文件锁、路径、换行符等环境差异），ubuntu 失败仍判定为构建失败
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        # pnpm 11 要求 Node.js >= 22（已不再支持 18/20/21）；engines 为 >=20.19，取 22 为基线
        node-version:
          - 22
          - 24
        include:
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ matrix.node-version }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.node-version }}-pnpm-store-
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check:tsc

      - name: Test
        run: pnpm test
